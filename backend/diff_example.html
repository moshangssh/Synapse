
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <title>差异比较示例</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 20px; }
                    .diff-container { padding: 20px; border: 1px solid #ccc; }
                    del { background-color: #ffe6e6; text-decoration: line-through; }
                    ins { background-color: #e6ffe6; text-decoration: underline; }
                </style>
            </head>
            <body>
                <h1>文本差异比较示例</h1>
                <div class="diff-container">
                    <span>The </span><del style="background:#ffe6e6;">quick</del><ins style="background:#e6ffe6;">fast</ins><span> brown fox</span><ins style="background:#e6ffe6;"> jumps</ins>
                </div>
            </body>
            </html>
